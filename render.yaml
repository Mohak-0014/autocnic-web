# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: autocnic-web
    runtime: docker
    plan: starter            # persistent disks need a paid plan; drop `disk` to use free
    healthCheckPath: /healthz
    envVars:
      - key: AUTOCNIC_BASIC_AUTH
        sync: false          # "user:password"; without it, only the bundled demos can be analyzed
      # Sized for the starter plan's 512 MB: one worker process per live session.
      - key: AUTOCNIC_MAX_LIVE_SESSIONS
        value: "6"
      - key: AUTOCNIC_WORKER_MEMORY_MB
        value: "400"
    disk:
      name: autocnic-data
      mountPath: /data
      sizeGB: 1
